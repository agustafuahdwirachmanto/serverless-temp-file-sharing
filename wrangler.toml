name = "serverless-temp-file-sharing"
main = "worker.js"
compatibility_date = "2024-01-01"

# ============================================================
# Optional Variables — Set as "Text" in Cloudflare Dashboard
# These customize the UI appearance and SEO metadata.
# All variables below are optional and have sensible defaults.
# ============================================================
[vars]
PAGE_TITLE = "Servku"
PAGE_LOGO = "https://drive.google.com/file/d/1mV5UsGIZAYwu40WA_7T15b-kf6yUv6wl/view?usp=drivesdk"
META_TITLE = "Servku"
META_DESCRIPTION = "Servku"
META_KEYWORD = "Servku"
META_URL = "https://files.servku.web.id"
HOME_PAGE_FORM_COLOR = "255, 255, 255"
UPLOAD_PAGE_FORM_COLOR = "255, 255, 255"
EXPIRED_PAGE_FORM_COLOR = "255, 255, 255"
ERROR_404_PAGE_FORM_COLOR = "255, 255, 255"
ERROR_404_FILE_FORM_COLOR = "255, 255, 255"
ERROR_501_UPLOAD_FORM_COLOR = "255, 255, 255"
ERROR_501_DOWNLOAD_FORM_COLOR = "255, 255, 255"
HOME_PAGE_BACKGROUND = "Animated Gradient"
UPLOAD_PAGE_BACKGROUND = "Animated Gradient"
EXPIRED_PAGE_BACKGROUND = "Animated Gradient"
ERROR_404_PAGE_BACKGROUND = "Animated Gradient"
ERROR_404_FILE_BACKGROUND = "Animated Gradient"
ERROR_501_UPLOAD_BACKGROUND = "Animated Gradient"
ERROR_501_DOWNLOAD_BACKGROUND = "Animated Gradient"

# ============================================================
# Required Secrets — Set as "Secret" in Cloudflare Dashboard
# Do NOT put actual secret values here. Configure them via:
#   Cloudflare Dashboard > Workers > Settings > Variables and Secrets
# Or use `wrangler secret put <KEY>` for CLI deployment.
# ============================================================
# GOOGLE_CLIENT_ID       → Google OAuth 2.0 Client ID
# GOOGLE_CLIENT_SECRET   → Google OAuth 2.0 Client Secret
# GOOGLE_REFRESH_TOKEN   → Google OAuth 2.0 Refresh Token
# DESTINATION_FOLDER_ID  → Google Drive Folder ID for uploads
